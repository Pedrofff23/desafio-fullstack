[project]
name = "gerenciamento-estoque-backend"
version = "1.0.0"
description = "API da plataforma de gerenciamento de estoque de produtos alimentícios"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "bcrypt==4.0.1",
    "email-validator==2.2.0",
    "fastapi==0.141.1",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.7.0",
    "pydantic==2.10.4",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "sqlalchemy[asyncio]==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "httpx==0.28.1",
    "pytest-asyncio==0.25.0",
    "pytest==8.3.4",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "B008",   # FastAPI dependency injection idiom (Depends in argument defaults)
    "E501",   # Line too long (handled by ruff format / long SQL strings / comments)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
